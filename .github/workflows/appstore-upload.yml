name: Build and Upload to App Store Connect

on:
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i Xcode
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$LATEST_XCODE" ]; then LATEST_XCODE="/Applications/Xcode.app"; fi
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version
          xcodebuild -showsdks | grep macos

      - name: Import signing certificates and provisioning profile
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          P12_INSTALLER_BASE64: ${{ secrets.P12_INSTALLER_BASE64 }}
          P12_INSTALLER_PASSWORD: ${{ secrets.P12_INSTALLER_PASSWORD }}
          PROVISION_PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo "$P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/certs.p12"
          echo "$P12_INSTALLER_BASE64" | base64 --decode -o "$RUNNER_TEMP/installer.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certs.p12" -P "$P12_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security import "$RUNNER_TEMP/installer.p12" -P "$P12_INSTALLER_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security find-identity -v "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision

      - name: Archive
        run: |
          xcodebuild -project MusicWidgets.xcodeproj -scheme MusicWidgets -configuration Release-AppStore \
            -archivePath "$RUNNER_TEMP/AudioDesk.xcarchive" archive

      - name: Export signed package
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>3rd Party Mac Developer Application: Irina Nizhelskaya (WCK4G7W296)</string>
              <key>installerSigningCertificate</key>
              <string>3rd Party Mac Developer Installer: Irina Nizhelskaya (WCK4G7W296)</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.musicwidgets.audiodesk</key>
                  <string>Audio Desk App Store CI</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/AudioDesk.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/Export"

      - name: Upload to App Store Connect
        env:
          APPLE_ID_EMAIL: ${{ secrets.APPLE_ID_EMAIL }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$RUNNER_TEMP/AudioDesk.xcarchive/Products/Applications/Audio Desk.app/Contents/Info.plist")
          BUNDLE_SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$RUNNER_TEMP/AudioDesk.xcarchive/Products/Applications/Audio Desk.app/Contents/Info.plist")
          xcrun altool --upload-package "$RUNNER_TEMP/Export/Audio Desk.pkg" \
            --type macos \
            -u "$APPLE_ID_EMAIL" \
            -p "$APP_SPECIFIC_PASSWORD" \
            --bundle-id "com.musicwidgets.audiodesk" \
            --bundle-version "$BUNDLE_VERSION" \
            --bundle-short-version-string "$BUNDLE_SHORT_VERSION"
